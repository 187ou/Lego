[project]
name = "lego-mate"
version = "0.1.0"
description = "LEGO-Mate 智能拼搭助手"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "neo4j>=5.20.0",
    "redis>=5.0.0",
    "chromadb>=0.5.0",
    "openai>=1.40.0",
    "dashscope>=1.20.0",
    "transformers>=4.44.0",
    "torch>=2.4.0",
    "Pillow>=10.0.0",
    "pandas>=2.0.0",
    "pypdf>=4.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "langchain-text-splitters>=1.1.2",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "prometheus-client>=0.20.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
