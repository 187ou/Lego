# ============================================
# 灰度发布配置（金丝雀发布）
# ============================================
# 使用方法:
#   1. 启动基础服务: docker compose up -d
#   2. 启动金丝雀: docker compose -f docker-compose.canary.yml up -d
#   3. 验证金丝雀正常后，逐步切流
#   4. 全部切流后，下线旧版本
# ============================================

version: "3.9"

services:
  # ===== 金丝雀版本（新版本） =====
  backend-canary:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lego-backend-canary
    ports:
      - "8001:8000"  # 不同端口
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=lego123456
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - VERSION=canary
    volumes:
      - ./data:/app/data
      - ./logs/canary:/app/logs
    depends_on:
      - neo4j
      - redis
    restart: unless-stopped
    networks:
      - lego-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ===== Nginx 负载均衡（灰度切流） =====
  nginx:
    image: nginx:alpine
    container_name: lego-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/canary.conf:/etc/nginx/conf.d/canary.conf:ro
    depends_on:
      - backend-canary
    restart: unless-stopped
    networks:
      - lego-network

networks:
  lego-network:
    external: true
