# ============================================
# 金丝雀发布配置
# ============================================
# 切流策略:
#   - 初始: 10% 流量到金丝雀
#   - 观察无问题后: 50% 流量到金丝雀
#   - 最终: 100% 流量到金丝雀（下线旧版本）
# ============================================

# 基于用户 ID 的灰度（确保同一用户始终走同一版本）
split_clients "${remote_addr}AAA" $backend_version {
    10%     canary;
    90%     stable;
}

# 基于请求头的灰度（测试人员走金丝雀）
map $http_x_canary $backend_version {
    "true"  canary;
    default stable;
}

upstream lego_stable {
    server backend:8000;
}

upstream lego_canary {
    server backend-canary:8000;
}
